<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПростикРостик</title>

<style>
body { margin:0; font-family:Arial; display:flex; flex-direction:column; height:100vh; }
body.dark { background:#0f172a; color:white; }
body.light { background:#f8fafc; color:black; }

header { padding:15px; display:flex; justify-content:space-between; }

#chat { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; }

.message { max-width:60%; padding:10px; margin:5px; border-radius:12px; }
.me { align-self:flex-end; background:#3b82f6; color:white; }
.other { align-self:flex-start; background:#e5e7eb; color:black; }

#inputArea { display:flex; padding:10px; }
#messageInput { flex:1; padding:10px; border-radius:10px; border:none; }
button { margin-left:10px; padding:10px; border-radius:10px; border:none; cursor:pointer; }
</style>
</head>

<body class="dark">

<header>
  ПростикРостик
</header>

<div id="chat"></div>

<div id="inputArea">
  <input id="messageInput" placeholder="Сообщение..." />
  <button id="sendBtn">➤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

// 🔥 Firebase config (твои данные)
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "prostikrostik-90812.firebaseapp.com",
  projectId: "prostikrostik-90812",
  storageBucket: "prostikrostik-90812.appspot.com"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

// ===== АВТОРИЗАЦИЯ =====
let currentUser = null;
let nickname = "Гость";

const provider = new GoogleAuthProvider();
signInWithPopup(auth, provider);

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (user) nickname = user.displayName;
});

// ===== ЧАТ =====
const chat = document.getElementById("chat");

const q = query(collection(db, "messages"), orderBy("time"));

onSnapshot(q, (snapshot) => {
  chat.innerHTML = "";
  snapshot.forEach(doc => {
    const data = doc.data();
    const div = document.createElement("div");

    const isMe = currentUser && data.uid === currentUser.uid;
    div.className = "message " + (isMe ? "me" : "other");

    let content = data.text || "";
    if (data.fileType === "audio") {
      content = `<audio controls src="${data.fileUrl}"></audio>`;
    }

    div.innerHTML = `<b>${data.user}</b><br>${content}`;
    chat.appendChild(div);
  });

  chat.scrollTop = chat.scrollHeight;
});

// ===== ТЕКСТ =====
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendBtn");

function sendMessage() {
  if (!messageInput.value || !currentUser) return;

  addDoc(collection(db, "messages"), {
    text: messageInput.value,
    user: nickname,
    uid: currentUser.uid,
    time: Date.now()
  });

  messageInput.value = "";
  updateButton();
}

// ===== ГОЛОСОВЫЕ =====
let mediaRecorder;
let audioChunks = [];
let isRecording = false;

function updateButton() {
  if (messageInput.value.trim() === "") {
    sendButton.textContent = isRecording ? "⏹" : "🎤";
    sendButton.onclick = isRecording ? stopRecording : startRecording;
  } else {
    sendButton.textContent = "➤";
    sendButton.onclick = sendMessage;
  }
}

messageInput.addEventListener("input", updateButton);
updateButton();

async function startRecording() {
  if (!currentUser) {
    alert("Войди в аккаунт!");
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      isRecording = false;
      updateButton();

      if (!audioChunks.length) {
        alert("Запись пустая");
        return;
      }

      const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
      const fileName = `audio_${Date.now()}.webm`;

      const storageRef = ref(storage, `audioMessages/${fileName}`);

      try {
        await uploadBytes(storageRef, audioBlob);
        const url = await getDownloadURL(storageRef);

        await addDoc(collection(db, "messages"), {
          user: nickname,
          uid: currentUser.uid,
          fileUrl: url,
          fileType: "audio",
          time: Date.now()
        });

        console.log("✅ Отправлено");
      } catch (err) {
        console.error("❌ Ошибка:", err);
        alert("Ошибка отправки");
      }
    };

    mediaRecorder.start();
    isRecording = true;
    updateButton();

  } catch (err) {
    console.error(err);
    alert("Нет доступа к микрофону");
  }
}

function stopRecording() {
  if (mediaRecorder && isRecording) {
    mediaRecorder.stop();
  }
}
</script>

</body>
</html>
