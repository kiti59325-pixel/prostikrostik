<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ПростикРостик</title>
<style>
  body { margin: 0; font-family: Arial; transition: 0.3s; }
  body.dark { background: #0f172a; color: white; }
  body.light { background: #f1f5f9; color: black; }

  /* Верхняя шапка */
  header {
    padding: 15px;
    font-size: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: inherit;
  }

  /* Панель аккаунта */
  #accountPanel {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding: 10px;
    background: inherit;
  }

  #accountPanel input { 
    flex: 1; 
    border-radius: 12px; 
    padding: 8px; 
    border: 1px solid #888; 
    outline: none;
    transition: 0.2s;
  }
  body.dark #accountPanel input { background: #334155; color: white; border-color: #555; }
  body.light #accountPanel input { background: #e2e8f0; color: black; border-color: #ccc; }

  #accountPanel button { 
    border-radius: 12px; 
    padding: 8px 12px; 
    border: none; 
    cursor: pointer; 
    transition: 0.2s;
  }
  body.dark #accountPanel button { background: #3b82f6; color: white; }
  body.light #accountPanel button { background: #3b82f6; color: white; }

  /* Чат */
  #chat {
    padding: 10px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    margin-top: 120px; /* место под шапку и панель аккаунта */
    margin-bottom: 70px; /* место под ввод */
    height: calc(100vh - 190px);
  }

  .message {
    max-width: 60%;
    width: fit-content;
    padding: 10px;
    margin: 5px;
    border-radius: 12px;
    position: relative;
    word-wrap: break-word;
  }
  .me { align-self: flex-end; background: #3b82f6; color: white; }
  .dark .other { background: #334155; color: white; }
  .light .other { background: #e2e8f0; color: black; }

  .name { font-size: 11px; opacity: 0.7; }
  .delete-btn { position: absolute; top: 2px; right: 6px; cursor: pointer; font-size: 12px; opacity: 0.6; }

  /* Панель ввода сообщений */
  #inputArea {
    display: flex;
    padding: 10px;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background-color: inherit;
    gap: 5px;
  }
  #inputArea input {
    flex: 1;
    padding: 10px;
    border-radius: 20px;  /* закруглено */
    border: 1px solid #888;
    outline: none;
    transition: 0.2s;
  }
  body.dark #inputArea input { background: #1e293b; color: white; border-color: #555; }
  body.light #inputArea input { background: #fff; color: black; border-color: #ccc; }

  #inputArea button {
    border-radius: 20px; /* закруглено */
    padding: 10px 16px;
    border: none;
    cursor: pointer;
    background: #3b82f6;
    color: white;
  }

  /* Адаптив */
  @media (max-width: 600px) {
    header { font-size: 16px; padding: 10px; }
    #accountPanel input, #accountPanel button { padding: 6px; font-size: 14px; }
    #inputArea input { padding: 8px; font-size: 14px; }
    #inputArea button { padding: 8px 12px; font-size: 14px; }
  }
</style>
</head>

<body class="dark">
<header>
  ПростикРостик
  <button onclick="toggleTheme()">🌗</button>
</header>

<div id="accountPanel">
  <input id="nickname" placeholder="Придумай ник..." />
  <button onclick="setNickname()">Сохранить ник</button>
  <button onclick="login()">Войти через Google</button>
  <button onclick="logout()">Выйти</button>
  <div id="userInfo" style="margin-left:10px; align-self:center;"></div>
</div>

<div id="chat"></div>

<div id="inputArea">
  <input id="messageInput" placeholder="Сообщение..." />
  <button onclick="sendMessage()">➤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDe5k1pVFUxSB33pxwtivIorB0VQ1atc08",
  authDomain: "prostikrostik-90812.firebaseapp.com",
  projectId: "prostikrostik-90812"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
let nickname = localStorage.getItem("nickname") || "";

// Вход через Google
async function login() {
  const provider = new GoogleAuthProvider();
  await signInWithPopup(auth, provider);
}
window.login = login;

function logout() {
  signOut(auth);
}
window.logout = logout;

// Авторизация
onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (!nickname && user) nickname = user.displayName;
  document.getElementById("userInfo").innerText =
    user ? "Ты: " + nickname : "Не вошёл";
});

// Смена ника
function setNickname() {
  const input = document.getElementById("nickname");
  nickname = input.value.trim() || (currentUser ? currentUser.displayName : "Гость");
  localStorage.setItem("nickname", nickname);
  document.getElementById("userInfo").innerText =
    currentUser ? "Ты: " + nickname : "Не вошёл";
  input.value = "";
  alert("Твой ник теперь: " + nickname);
}
window.setNickname = setNickname;

// Отправка сообщений
function sendMessage() {
  const input = document.getElementById("messageInput");
  if (!input.value || !currentUser) return;
  addDoc(collection(db, "messages"), {
    text: input.value,
    user: nickname || (currentUser ? currentUser.displayName : "Гость"),
    uid: currentUser.uid,
    time: Date.now()
  });
  input.value = "";
}
window.sendMessage = sendMessage;

// Чат
const chat = document.getElementById("chat");
const q = query(collection(db, "messages"), orderBy("time"));

onSnapshot(q, (snapshot) => {
  chat.innerHTML = "";
  snapshot.forEach(docSnap => {
    const data = docSnap.data();
    const isMe = currentUser && data.uid === currentUser.uid;
    const div = document.createElement("div");
    div.className = "message " + (isMe ? "me" : "other");
    div.innerHTML = `
      <div class="name">${data.user}</div>
      ${data.text}
      ${isMe ? `<span class="delete-btn" onclick="deleteMessage('${docSnap.id}')">❌</span>` : ""}
    `;
    chat.appendChild(div);
  });
  chat.scrollTop = chat.scrollHeight;
});

// Удаление сообщений
async function deleteMessage(id) {
  await deleteDoc(doc(db, "messages", id));
}
window.deleteMessage = deleteMessage;

// Смена темы
function toggleTheme() {
  const body = document.body;
  body.classList.toggle("dark");
  body.classList.toggle("light");
}
window.toggleTheme = toggleTheme;
</script>
</body>
</html>
