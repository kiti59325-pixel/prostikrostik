<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ПростикРостик - Чаты</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  transition: 0.3s;
}
body.dark {
  background: #0f172a;
  color: white;
}
body.light {
  background: #f1f5f9;
  color: black;
}

header {
  padding: 15px;
  font-size: 18px;
  display: flex;
  justify-content: space-between;
}
.dark header { background: #1e293b; }
.light header { background: #e2e8f0; }

#container {
  display: flex;
  height: calc(100vh - 50px);
}

#chatList {
  width: 250px;
  border-right: 1px solid #ccc;
  overflow-y: auto;
  padding: 10px;
}
.dark #chatList { border-color: #334155; }

.chat-item {
  padding: 8px;
  cursor: pointer;
  border-radius: 5px;
  margin-bottom: 5px;
}
.chat-item.active {
  background: #3b82f6;
  color: white;
}
.dark .chat-item.active { background: #2563eb; }

#chatArea {
  flex: 1;
  display: flex;
  flex-direction: column;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
}
.message {
  max-width: 60%;
  width: fit-content;
  padding: 10px;
  margin: 5px;
  border-radius: 12px;
  position: relative;
  word-wrap: break-word;
}
.me { align-self: flex-end; background: #3b82f6; color: white; }
.dark .other { background: #334155; }
.light .other { background: #e2e8f0; }
.name { font-size: 11px; opacity: 0.7; }
.delete-btn { position: absolute; top: 2px; right: 6px; cursor: pointer; font-size: 12px; opacity: 0.6; }

#inputArea {
  display: flex;
  padding: 10px;
}
.dark #inputArea { background: #1e293b; }
.light #inputArea { background: #e2e8f0; }

input { flex: 1; padding: 10px; border-radius: 10px; border: none; outline: none; }
button { margin-left: 10px; padding: 10px; border: none; border-radius: 10px; cursor: pointer; }

#newChatForm { margin-bottom: 10px; }
</style>
</head>

<body class="dark">

<header>
  ПростикРостик
  <button onclick="toggleTheme()">🌗</button>
</header>

<div style="padding:10px;">
  <input id="username" placeholder="Введи свой ник..." />
  <button onclick="login()">Войти через Google</button>
  <button onclick="logout()">Выйти</button>
  <div id="userInfo"></div>
</div>

<div id="container">
  <div id="chatList">
    <form id="newChatForm">
      <input id="chatName" placeholder="Имя нового чата..." />
      <button type="submit">Создать чат</button>
    </form>
    <!-- Список чатов появится здесь -->
  </div>

  <div id="chatArea">
    <div id="chat"></div>
    <div id="inputArea">
      <input id="messageInput" placeholder="Сообщение..." />
      <button onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, getDocs 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { 
  getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// ====== CONFIG ======
const firebaseConfig = {
  apiKey: "AIzaSyDe5k1pVFUxSB33pxwtivIorB0VQ1atc08",
  authDomain: "prostikrostik-90812.firebaseapp.com",
  projectId: "prostikrostik-90812"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
let currentChatId = null;

// ====== THEME ======
function toggleTheme() {
  document.body.classList.toggle("dark");
  document.body.classList.toggle("light");
}
window.toggleTheme = toggleTheme;

// ====== AUTH ======
async function login() {
  const provider = new GoogleAuthProvider();
  await signInWithPopup(auth, provider);
}
window.login = login;

function logout() {
  signOut(auth);
}
window.logout = logout;

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  document.getElementById("userInfo").innerText =
    user ? "Ты: " + user.displayName : "Не вошёл";
  loadChats();
});

// ====== CHATS ======
const chatListDiv = document.getElementById("chatList");
const chatDiv = document.getElementById("chat");
const newChatForm = document.getElementById("newChatForm");

async function loadChats() {
  chatListDiv.querySelectorAll(".chat-item").forEach(el => el.remove());
  const snapshot = await getDocs(collection(db, "chats"));
  snapshot.forEach(docSnap => {
    const data = docSnap.data();
    // показываем только чаты, где есть пользователь
    if(!currentUser || !data.members.includes(currentUser.uid)) return;

    const div = document.createElement("div");
    div.className = "chat-item";
    div.innerText = data.name;
    div.onclick = () => selectChat(docSnap.id, data.name);
    chatListDiv.appendChild(div);
  });
}

newChatForm.onsubmit = async (e) => {
  e.preventDefault();
  if (!currentUser) return;
  const name = document.getElementById("chatName").value.trim();
  if(!name) return;

  const chatRef = await addDoc(collection(db, "chats"), {
    name: name,
    members: [currentUser.uid]
  });

  document.getElementById("chatName").value = "";
  loadChats();
};

// ====== SELECT CHAT ======
function selectChat(chatId, chatName) {
  currentChatId = chatId;
  chatDiv.innerHTML = "";
  chatListDiv.querySelectorAll(".chat-item").forEach(el => el.classList.remove("active"));
  [...chatListDiv.children].forEach(el => { if(el.innerText===chatName) el.classList.add("active"); });

  const q = query(collection(db, "chats", chatId, "messages"), orderBy("time"));
  onSnapshot(q, (snapshot) => {
    chatDiv.innerHTML = "";
    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      const isMe = currentUser && data.uid === currentUser.uid;
      const div = document.createElement("div");
      div.className = "message " + (isMe ? "me" : "other");
      div.innerHTML = `<div class="name">${data.user}</div>${data.text}${isMe ? `<span class="delete-btn" onclick="deleteMessage('${chatId}','${docSnap.id}')">❌</span>` : ""}`;
      chatDiv.appendChild(div);
    });
    chatDiv.scrollTop = chatDiv.scrollHeight;
  });
}

// ====== MESSAGES ======
async function sendMessage() {
  const input = document.getElementById("messageInput");
  if (!input.value || !currentUser || !currentChatId) return;

  await addDoc(collection(db, "chats", currentChatId, "messages"), {
    text: input.value,
    user: currentUser.displayName,
    uid: currentUser.uid,
    time: Date.now()
  });
  input.value = "";
}

window.sendMessage = sendMessage;

async function deleteMessage(chatId, msgId) {
  await deleteDoc(doc(db, "chats", chatId, "messages", msgId));
}
window.deleteMessage = deleteMessage;

</script>
</body>
</html>
