<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПростикРостик</title>

<style>
  body { margin: 0; font-family: Arial; transition: 0.3s; }
  body.dark { background: #0f172a; color: white; }
  body.light { background: #f1f5f9; color: black; }

  header {
    padding: 10px;
    font-size: 16px;
    display: flex;
    justify-content: space-between;
  }

  .dark header { background: #1e293b; }
  .light header { background: #e2e8f0; }

  #userPanel {
    padding: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  body.dark #userPanel { background-color: #1e293b; }
  body.light #userPanel { background-color: #e2e8f0; }

  #userPanel input {
    padding: 6px;
    border-radius: 8px;
    border: none;
  }

  #userPanel button {
    border-radius: 8px;
    padding: 6px 10px;
    border: none;
    cursor: pointer;
    font-size: 13px;
  }

  body.dark #userPanel button { background-color: #2563eb; color: white; }
  body.light #userPanel button { background-color: #3b82f6; color: white; }

  /* 🔥 ВМЕЩАЕМ ВСЁ В ЭКРАН */
  #chat {
    height: 55vh;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
  }

  .message {
    max-width: 60%;
    padding: 8px;
    margin: 4px;
    border-radius: 10px;
    font-size: 13px;
  }

  .me { align-self: flex-end; background: #3b82f6; color: white; }
  .dark .other { background: #334155; }
  .light .other { background: #e2e8f0; color: black; }

  #inputArea {
    display: flex;
    padding: 8px;
    gap: 6px;
  }

  #messageInput {
    flex: 1;
    padding: 8px;
    border-radius: 20px;
    border: none;
    outline: none;
    font-size: 13px;
  }

  body.light #messageInput {
    background: white;
  }

  body.dark #messageInput {
    background: transparent;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
  }

  button { cursor: pointer; }

  /* 📱 МОБИЛКА */
  @media (max-width: 600px) {

    header {
      font-size: 14px;
      padding: 8px;
    }

    #userPanel {
      flex-direction: column;
    }

    #chat {
      height: 50vh;
    }

    .message {
      max-width: 85%;
      font-size: 15px;
    }

    #messageInput {
      font-size: 15px;
    }
  }
</style>
</head>

<body class="dark">

<header>
  ПростикРостик
  <button onclick="toggleTheme()">🌗</button>
</header>

<div id="userPanel">
  <input id="nickname" placeholder="Ник..." />
  <button onclick="setNickname()">Ок</button>
  <button onclick="login()">Войти</button>
  <button onclick="logout()">Выйти</button>
  <div id="userInfo"></div>
</div>

<div id="chat"></div>

<div id="inputArea">
  <input id="messageInput" placeholder="Сообщение..." />
  <button onclick="sendMessage()">➤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDe5k1pVFUxSB33pxwtivIorB0VQ1atc08",
  authDomain: "prostikrostik-90812.firebaseapp.com",
  projectId: "prostikrostik-90812"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
let nickname = localStorage.getItem("nickname") || "";

async function login() {
  const provider = new GoogleAuthProvider();
  await signInWithPopup(auth, provider);
}
window.login = login;

function logout() {
  signOut(auth);
}
window.logout = logout;

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (!nickname && user) nickname = user.displayName;
  document.getElementById("userInfo").innerText =
    user ? "Ты: " + nickname : "Не вошёл";
});

function setNickname() {
  const input = document.getElementById("nickname");
  nickname = input.value.trim() || (currentUser ? currentUser.displayName : "Гость");
  document.getElementById("userInfo").innerText =
    currentUser ? "Ты: " + nickname : "Не вошёл";
  localStorage.setItem("nickname", nickname);
  input.value = "";
}
window.setNickname = setNickname;

function sendMessage() {
  const input = document.getElementById("messageInput");
  if (!input.value || !currentUser) return;

  addDoc(collection(db, "messages"), {
    text: input.value,
    user: nickname || currentUser.displayName,
    uid: currentUser.uid,
    time: Date.now()
  });

  input.value = "";
}
window.sendMessage = sendMessage;

const chat = document.getElementById("chat");
const q = query(collection(db, "messages"), orderBy("time"));

onSnapshot(q, (snapshot) => {
  chat.innerHTML = "";
  snapshot.forEach(docSnap => {
    const data = docSnap.data();
    const isMe = currentUser && data.uid === currentUser.uid;

    const div = document.createElement("div");
    div.className = "message " + (isMe ? "me" : "other");
    div.innerHTML = `
      <div style="font-size:10px;opacity:0.6">${data.user}</div>
      ${data.text}
      ${isMe ? `<span style="font-size:10px;cursor:pointer" onclick="deleteMessage('${docSnap.id}')">❌</span>` : ""}
    `;

    chat.appendChild(div);
  });

  chat.scrollTop = chat.scrollHeight;
});

async function deleteMessage(id) {
  await deleteDoc(doc(db, "messages", id));
}
window.deleteMessage = deleteMessage;

function toggleTheme() {
  document.body.classList.toggle("dark");
  document.body.classList.toggle("light");
}
window.toggleTheme = toggleTheme;
</script>

</body>
</html>
