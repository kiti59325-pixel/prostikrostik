<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПростикРостик</title>
<style>
  body { margin:0; font-family:Arial; transition:0.3s; display:flex; flex-direction:column; height:100vh; }
  body.dark { background:#0f172a; color:white; }
  body.light { background:#f8fafc; color:black; }
  header { padding:15px; font-size:18px; display:flex; justify-content:space-between; align-items:center; }
  #headerButtons { display:flex; gap:10px; align-items:center; }
  #themeBtn, #mobileMenuBtn { cursor:pointer; border:none; background:none; font-size:18px; }
  #userPanel { padding:10px; display:flex; flex-wrap:wrap; gap:10px; border-radius:0 0 12px 12px; }
  #userPanel button { border-radius:12px; padding:10px 15px; border:none; cursor:pointer; font-weight:500; }
  #nickname { padding:10px; border-radius:10px; border:1px solid #ccc; background:inherit; color:inherit; }
  #chat { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; }
  .message { max-width:60%; width:fit-content; padding:10px; margin:5px; border-radius:12px; position:relative; word-wrap:break-word; }
  .message audio { max-width:200px; display:block; }
  .me { align-self:flex-end; background:#273c73; color:white; }
  .other { background:#e5e7eb; color:black; }
  .name { font-size:11px; opacity:0.7; }
  .delete-btn { position:absolute; top:2px; right:6px; cursor:pointer; font-size:12px; opacity:0.6; }
  #inputArea { display:flex; padding:10px; }
  #messageInput { flex:1; padding:10px; border-radius:25px; border:none; background:inherit; color:inherit; }
  #sendRecordBtn { margin-left:10px; border-radius:25px; cursor:pointer; }
</style>
</head>
<body>

<header>
  ПростикРостик
  <div id="headerButtons">
    <button id="themeBtn">🌗</button>
  </div>
</header>

<div id="userPanel">
  <input id="nickname" placeholder="Придумай ник..." />
  <button onclick="setNickname()">Сохранить ник</button>
  <button onclick="login()">Войти через Google</button>
  <button onclick="logout()">Выйти</button>
  <div id="userInfo"></div>
</div>

<div id="chat"></div>

<div id="inputArea">
  <input id="messageInput" placeholder="Сообщение..." />
  <button id="sendRecordBtn">🎤</button>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL = 'https://cdasjlliptlfxguwtufq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkYXNqbGxpcHRsZnhndXd0dWZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MDI4MjgsImV4cCI6MjA5MDk3ODgyOH0.TIrd3D8k_Cw60xhKOnHOjKVPsjLU7G2S2TelTOgMk-c';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let nickname = localStorage.getItem('nickname') || '';
let theme = localStorage.getItem('theme') || 'dark';
document.body.classList.add(theme);

// ===== AUTH =====
async function login() {
  await supabase.auth.signInWithOAuth({ provider: 'google' });
}
window.login = login;

async function logout() {
  await supabase.auth.signOut();
  currentUser = null;
  document.getElementById('userInfo').innerText = 'Не вошёл';
}
window.logout = logout;

supabase.auth.onAuthStateChange((_event, session) => {
  currentUser = session?.user || null;
  if (!nickname && currentUser) nickname = currentUser.user_metadata.full_name || 'Гость';
  document.getElementById('userInfo').innerText = currentUser ? 'Ты: ' + nickname : 'Не вошёл';
});

// ===== NICKNAME =====
function setNickname() {
  const input = document.getElementById('nickname');
  nickname = input.value.trim() || (currentUser?.user_metadata.full_name || 'Гость');
  document.getElementById('userInfo').innerText = currentUser ? 'Ты: ' + nickname : 'Не вошёл';
  input.value = '';
  localStorage.setItem('nickname', nickname);
}
window.setNickname = setNickname;

// ===== CHAT =====
const chat = document.getElementById('chat');
let messagesCache = [];

async function fetchMessages() {
  const { data, error } = await supabase
    .from('messages')
    .select('*')
    .order('time', { ascending: true });
  if (error) console.error(error);
  else { messagesCache = data; renderMessages(); }
}

fetchMessages();

// Realtime
supabase
  .channel('public:messages')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, payload => {
    fetchMessages();
  })
  .subscribe();

function renderMessages() {
  chat.innerHTML = '';
  messagesCache.forEach(msg => {
    const isMe = currentUser && msg.uid === currentUser.id;
    const displayName = isMe ? nickname : msg.user;
    const div = document.createElement('div');
    div.className = 'message ' + (isMe ? 'me' : 'other');
    div.innerHTML = `<div class="name">${displayName}</div>`;

    if (msg.isAudio) {
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.src = msg.text;
      div.appendChild(audio);
    } else {
      div.insertAdjacentHTML('beforeend', msg.text);
    }

    if (isMe) {
      const delBtn = document.createElement('span');
      delBtn.className = 'delete-btn';
      delBtn.textContent = '❌';
      delBtn.onclick = async () => {
        await supabase.from('messages').delete().eq('id', msg.id);
      };
      div.appendChild(delBtn);
    }

    chat.appendChild(div);
  });
  chat.scrollTop = chat.scrollHeight;
}

// ===== THEME =====
function toggleTheme() {
  document.body.classList.toggle('dark');
  document.body.classList.toggle('light');
  localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
}
document.getElementById('themeBtn').onclick = toggleTheme;

// ===== SEND MESSAGES & AUDIO =====
const messageInput = document.getElementById('messageInput');
const sendRecordBtn = document.getElementById('sendRecordBtn');

let mediaRecorder, audioChunks = [], isRecording = false;

sendRecordBtn.addEventListener('click', async () => {
  if (messageInput.value.trim() !== '') {
    if (!currentUser) return;
    await supabase.from('messages').insert([{
      text: messageInput.value,
      user: nickname,
      uid: currentUser.id,
      time: Date.now(),
      isAudio: false
    }]);
    messageInput.value = '';
  } else {
    if (!isRecording) {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onloadend = async () => {
          const base64Audio = reader.result;
          if (!currentUser) return;
          await supabase.from('messages').insert([{
            text: base64Audio,
            user: nickname,
            uid: currentUser.id,
            time: Date.now(),
            isAudio: true
          }]);
        };
        reader.readAsDataURL(audioBlob);
        stream.getTracks().forEach(track => track.stop());
      };
      mediaRecorder.start();
      isRecording = true;
      sendRecordBtn.textContent = '⏹️';
    } else {
      mediaRecorder.stop();
      isRecording = false;
      sendRecordBtn.textContent = '🎤';
    }
  }
});
</script>
</body>
</html>
