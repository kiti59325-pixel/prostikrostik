<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПростикРостик</title>
<style>
  :root {
    --dark-bg: #0f172a;
    --dark-header: #1e293b;
    --dark-input: #1e293b;
    --dark-other-msg: #334155;
    --dark-btn: #3b82f6;
    
    --light-bg: #f1f5f9;
    --light-header: #e2e8f0;
    --light-input: #e2e8f0;
    --light-other-msg: #d1d5db;
    --light-btn: #3b82f6;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    transition: 0.3s;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  body.dark {
    background: var(--dark-bg);
    color: white;
  }

  body.light {
    background: var(--light-bg);
    color: black;
  }

  header {
    padding: 15px;
    font-size: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  body.dark header { background: var(--dark-header); }
  body.light header { background: var(--light-header); }

  .container {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 10px;
  }

  #userPanel {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 10px;
  }

  #userPanel input {
    flex: 1;
    padding: 10px;
    border-radius: 12px;
    border: none;
    outline: none;
  }

  #userPanel button {
    padding: 10px 15px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }

  body.dark #userPanel button { background: var(--dark-btn); color: white; }
  body.light #userPanel button { background: var(--light-btn); color: white; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
  }

  .message {
    max-width: 70%;
    width: fit-content;
    padding: 10px;
    margin: 5px;
    border-radius: 15px;
    position: relative;
    word-wrap: break-word;
  }

  .me { align-self: flex-end; background: var(--dark-btn); color: white; }
  .other { border-radius: 15px; }

  body.dark .other { background: var(--dark-other-msg); }
  body.light .other { background: var(--light-other-msg); }

  .name {
    font-size: 11px;
    opacity: 0.7;
    margin-bottom: 3px;
  }

  .delete-btn {
    position: absolute;
    top: 2px;
    right: 6px;
    cursor: pointer;
    font-size: 12px;
    opacity: 0.6;
  }

  #inputArea {
    display: flex;
    padding: 10px;
    gap: 10px;
  }

  #inputArea input {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    outline: none;
  }

  #inputArea button {
    padding: 12px 18px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
  }

  body.dark #inputArea { background: var(--dark-header); }
  body.light #inputArea { background: var(--light-header); }

  /* Адаптивность */
  @media (max-width: 600px) {
    header { font-size: 18px; }
    #userPanel { flex-direction: column; }
    #userPanel button { width: 100%; }
  }
</style>
</head>
<body class="dark">

<header>
  ПростикРостик
  <button onclick="toggleTheme()">🌗</button>
</header>

<div class="container">

  <div id="userPanel">
    <input id="nickname" placeholder="Придумай ник..." />
    <button onclick="setNickname()">Сохранить ник</button>
    <button onclick="login()">Войти через Google</button>
    <button onclick="logout()">Выйти</button>
    <div id="userInfo"></div>
  </div>

  <div id="chat"></div>

  <div id="inputArea">
    <input id="messageInput" placeholder="Сообщение..." />
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDe5k1pVFUxSB33pxwtivIorB0VQ1atc08",
  authDomain: "prostikrostik-90812.firebaseapp.com",
  projectId: "prostikrostik-90812"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
let nickname = "";

// Вход через Google
async function login() {
  const provider = new GoogleAuthProvider();
  try { await signInWithPopup(auth, provider); }
  catch(e) { alert("Ошибка входа: " + e.message); }
}
window.login = login;

function logout() { signOut(auth); }
window.logout = logout;

// Авторизация
onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (!nickname && user) nickname = user.displayName;
  document.getElementById("userInfo").innerText =
    user ? "Ты: " + nickname : "Не вошёл";
});

// Смена ника
function setNickname() {
  const input = document.getElementById("nickname");
  nickname = input.value.trim() || (currentUser ? currentUser.displayName : "Гость");
  document.getElementById("userInfo").innerText =
    currentUser ? "Ты: " + nickname : "Не вошёл";
  input.value = "";
  alert("Твой ник теперь: " + nickname);
}
window.setNickname = setNickname;

// Отправка сообщений
function sendMessage() {
  const input = document.getElementById("messageInput");
  if (!input.value || !currentUser) return;
  addDoc(collection(db, "messages"), {
    text: input.value,
    user: nickname || (currentUser ? currentUser.displayName : "Гость"),
    uid: currentUser.uid,
    time: Date.now()
  });
  input.value = "";
}
window.sendMessage = sendMessage;

// Чат
const chat = document.getElementById("chat");
const q = query(collection(db, "messages"), orderBy("time"));

onSnapshot(q, (snapshot) => {
  chat.innerHTML = "";
  snapshot.forEach(docSnap => {
    const data = docSnap.data();
    const isMe = currentUser && data.uid === currentUser.uid;
    const div = document.createElement("div");
    div.className = "message " + (isMe ? "me" : "other");
    div.innerHTML = `
      <div class="name">${data.user}</div>
      ${data.text}
      ${isMe ? `<span class="delete-btn" onclick="deleteMessage('${docSnap.id}')">❌</span>` : "" }
    `;
    chat.appendChild(div);
  });
  chat.scrollTop = chat.scrollHeight;
});

// Удаление сообщений
async function deleteMessage(id) {
  await deleteDoc(doc(db, "messages", id));
}
window.deleteMessage = deleteMessage;

// Смена темы
function toggleTheme() {
  const body = document.body;
  body.classList.toggle("dark");
  body.classList.toggle("light");
}
window.toggleTheme = toggleTheme;

</script>
</body>
</html>
