<!-- Панель с ником и кнопками -->
<div id="userPanel">
  <input id="nickname" placeholder="Придумай ник..." />
  <button onclick="setNickname()">Сохранить ник</button>
  <button onclick="login()">Войти через Google</button>
  <button onclick="logout()">Выйти</button>
  <div id="userInfo"></div>
</div>

<div id="chat"></div>

<div id="inputArea">
  <input id="messageInput" placeholder="Сообщение..." />
  <button onclick="sendMessage()">➤</button>
</div>

<style>
/* Фиксируем панель с ником и кнопками сверху */
#userPanel {
  position: sticky; /* фиксируется при прокрутке */
  top: 0;
  z-index: 100;
  background-color: inherit; /* сохраняет тему */
  padding: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

/* Адаптивность на телефоне */
@media (max-width: 600px) {
  #userPanel { flex-direction: column; }
  #userPanel button { width: 100%; }
}
</style>
