<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПростикРостик</title>

<style>
body { margin:0; font-family:Arial; display:flex; flex-direction:column; height:100vh; transition:0.3s;}
body.dark { background:#0f172a; color:white;}
body.light { background:#f8fafc; color:black;}

header { padding:15px; display:flex; justify-content:space-between; align-items:center;}
body.dark header { background:#1e293b;}
body.light header { background:#f1f5f9;}

#chat { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column;}

.message {
  max-width:70%;
  padding:10px;
  margin:5px;
  border-radius:12px;
  position:relative;
}

.me { align-self:flex-end; }
.other { align-self:flex-start; }

body.dark .me { background:#2563eb; }
body.dark .other { background:#334155; }

body.light .me { background:#bfdbfe; color:black; }
body.light .other { background:#e5e7eb; color:black; }

.name { font-size:11px; opacity:0.7; margin-bottom:4px;}

#inputArea {
  display:flex;
  padding:10px;
}

#messageInput {
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  outline:none;
}

#sendRecordBtn {
  margin-left:10px;
  border:none;
  border-radius:50%;
  width:44px;
  height:44px;
  font-size:18px;
  cursor:pointer;
}

/* ===== ГОЛОСОВЫЕ ===== */

.voice {
  display:flex;
  flex-direction:column;
  gap:4px;
  margin-top:5px;
  max-width:260px;
}

.voice-top {
  display:flex;
  align-items:center;
  gap:10px;
}

.play-btn {
  width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  font-size:16px;
}

/* ЦВЕТА */
body.dark .me .play-btn { background:#1d4ed8; color:white; }
body.dark .other .play-btn { background:#475569; color:white; }

body.light .me .play-btn { background:#3b82f6; color:white; }
body.light .other .play-btn { background:#d1d5db; color:#111; }

/* ПРОГРЕСС */
.progress {
  flex:1;
  height:6px;
  border-radius:4px;
  position:relative;
  cursor:pointer;
}

body.dark .me .progress { background:#1e293b; }
body.dark .other .progress { background:#334155; }

body.light .me .progress { background:#dbeafe; }
body.light .other .progress { background:#f1f5f9; }

.progress-bar {
  height:100%;
  width:0%;
  border-radius:4px;
}

body.dark .me .progress-bar { background:#60a5fa; }
body.dark .other .progress-bar { background:#94a3b8; }

body.light .me .progress-bar { background:#2563eb; }
body.light .other .progress-bar { background:#6b7280; }

/* НИЖНЯЯ СТРОКА */
.voice-bottom {
  display:flex;
  justify-content:space-between;
  padding-left:46px;
  font-size:12px;
  opacity:0.8;
}

.speed {
  cursor:pointer;
}

</style>
</head>

<body class="dark">

<header>
  ПростикРостик
  <button onclick="toggleTheme()">🌗</button>
</header>

<div id="chat"></div>

<div id="inputArea">
  <input id="messageInput" placeholder="Сообщение...">
  <button id="sendRecordBtn">🎤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSy...",
  authDomain: "prostikrostik-90812.firebaseapp.com",
  projectId: "prostikrostik-90812"
});

const db = getFirestore(app);

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const btn = document.getElementById("sendRecordBtn");

let mediaRecorder;
let audioChunks = [];
let isRecording = false;
  const q = query(collection(db, "messages"), orderBy("time"));

onSnapshot(q, (snapshot) => {
  chat.innerHTML = "";

  snapshot.forEach(docSnap => {
    const data = docSnap.data();

    const div = document.createElement("div");
    div.className = "message " + (data.me ? "me" : "other");

    div.innerHTML = `<div class="name">${data.user}</div>`;

    // ===== ЕСЛИ ЭТО ГОЛОСОВОЕ =====
    if (data.audio) {

      const voice = document.createElement("div");
      voice.className = "voice";

      const top = document.createElement("div");
      top.className = "voice-top";

      const playBtn = document.createElement("div");
      playBtn.className = "play-btn";
      playBtn.textContent = "▶";

      const progress = document.createElement("div");
      progress.className = "progress";

      const bar = document.createElement("div");
      bar.className = "progress-bar";

      progress.appendChild(bar);

      const audio = document.createElement("audio");
      audio.src = data.audio;

      // скорость из localStorage
      let savedSpeed = parseFloat(localStorage.getItem("audioSpeed")) || 1;
      audio.playbackRate = savedSpeed;

      // КНОПКА PLAY
      playBtn.onclick = () => {
        document.querySelectorAll("audio").forEach(a => {
          if (a !== audio) a.pause();
        });

        if (audio.paused) {
          audio.play();
          playBtn.textContent = "❚❚";
        } else {
          audio.pause();
          playBtn.textContent = "▶";
        }
      };

      // ПРОГРЕСС
      audio.ontimeupdate = () => {
        const percent = (audio.currentTime / audio.duration) * 100;
        bar.style.width = percent + "%";
        time.textContent = formatTime(audio.currentTime);
      };

      audio.onended = () => {
        playBtn.textContent = "▶";
        bar.style.width = "0%";
      };

      // ПЕРЕМОТКА
      progress.onclick = (e) => {
        const rect = progress.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const percent = x / rect.width;
        audio.currentTime = percent * audio.duration;
      };

      // НИЖНЯЯ ЧАСТЬ
      const bottom = document.createElement("div");
      bottom.className = "voice-bottom";

      const time = document.createElement("span");
      time.textContent = "0:00";

      // когда загрузится длительность
      audio.onloadedmetadata = () => {
        time.textContent = formatTime(audio.duration);
      };

      const speed = document.createElement("span");
      speed.className = "speed";
      speed.textContent = savedSpeed + "x";

      // СМЕНА СКОРОСТИ ДЛЯ ВСЕХ
      speed.onclick = () => {
        let rate = parseFloat(localStorage.getItem("audioSpeed")) || 1;
        rate += 0.5;
        if (rate > 2) rate = 0.5;

        localStorage.setItem("audioSpeed", rate);

        document.querySelectorAll("audio").forEach(a => {
          a.playbackRate = rate;
        });

        document.querySelectorAll(".speed").forEach(s => {
          s.textContent = rate + "x";
        });
      };

      // СКАЧАТЬ
      const download = document.createElement("span");
      download.textContent = "⬇";
      download.style.cursor = "pointer";

      download.onclick = () => {
        const a = document.createElement("a");
        a.href = data.audio;
        a.download = "voice.webm";
        a.click();
      };

      bottom.appendChild(time);
      bottom.appendChild(speed);
      bottom.appendChild(download);

      top.appendChild(playBtn);
      top.appendChild(progress);

      voice.appendChild(top);
      voice.appendChild(bottom);

      div.appendChild(voice);

    } else {
      div.innerHTML += `<div>${data.text}</div>`;
    }

    chat.appendChild(div);
  });

  chat.scrollTop = chat.scrollHeight;
});

function formatTime(sec) {
  if (!sec || isNaN(sec)) return "0:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ":" + (s < 10 ? "0" : "") + s;
}
  // ===== ОТПРАВКА ТЕКСТА =====
btn.onclick = async () => {
  if (input.value.trim() !== "") {
    await addDoc(collection(db, "messages"), {
      text: input.value,
      user: "Ты",
      me: true,
      time: Date.now()
    });
    input.value = "";
  } else {
    // если пусто — запись
    startRecording();
  }
};

// ===== ЗАПИСЬ =====
async function startRecording() {
  if (isRecording) {
    mediaRecorder.stop();
    isRecording = false;
    btn.textContent = "🎤";
    return;
  }

  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

  mediaRecorder = new MediaRecorder(stream);
  audioChunks = [];

  mediaRecorder.ondataavailable = e => {
    audioChunks.push(e.data);
  };

  mediaRecorder.onstop = async () => {
    const blob = new Blob(audioChunks, { type: "audio/webm" });

    const reader = new FileReader();
    reader.readAsDataURL(blob);

    reader.onloadend = async () => {
      await addDoc(collection(db, "messages"), {
        audio: reader.result,
        user: "Ты",
        me: true,
        time: Date.now()
      });
    };
  };

  mediaRecorder.start();
  isRecording = true;
  btn.textContent = "⏹";
}

// ===== ТЕМА =====
function toggleTheme() {
  document.body.classList.toggle("dark");
  document.body.classList.toggle("light");

  const theme = document.body.classList.contains("dark") ? "dark" : "light";
  localStorage.setItem("theme", theme);
}

// применяем тему при загрузке
const savedTheme = localStorage.getItem("theme");
if (savedTheme) {
  document.body.classList.remove("dark", "light");
  document.body.classList.add(savedTheme);
}
</script>

</body>
</html>
