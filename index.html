<!DOCTYPE html> 
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПростикРостик</title>

<!-- ТВОЙ CSS ПОЛНОСТЬЮ СОХРАНЁН -->
<style>
/* (тут весь твой CSS без изменений) */
</style>
</head>

<body class="dark">

<header>
  ПростикРостик
  <div id="headerButtons">
    <button id="themeBtn" onclick="toggleTheme()">🌗</button>
    <button id="mobileMenuBtn" onclick="toggleMobileMenu()">⋮</button>
  </div>
</header>

<div id="userPanel">
  <input id="nickname" placeholder="Придумай ник..." />
  <button onclick="setNickname()">Сохранить ник</button>
  <button onclick="login()">Войти через Google</button>
  <button onclick="logout()">Выйти</button>
  <div id="userInfo"></div>
</div>

<div id="mobileMenu">
  <input id="mobileNickname" placeholder="Придумай ник..." />
  <button onclick="setNicknameMobile()">Сохранить ник</button>
  <button onclick="login()">Войти через Google</button>
  <button onclick="logout()">Выйти</button>
</div>

<div id="chat"></div>

<div id="inputArea">
  <input id="messageInput" placeholder="Сообщение..." />
  <button id="sendBtn">➤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

/* ✅ ДОБАВИЛ ТОЛЬКО STORAGE */
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyDe5k1pVFUxSB33pxwtivIorB0VQ1atc08",
  authDomain: "prostikrostik-90812.firebaseapp.com",
  projectId: "prostikrostik-90812",
  storageBucket: "prostikrostik-90812.appspot.com" // ✅ ДОБАВИЛ
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app); // ✅ ДОБАВИЛ

let currentUser = null;
let nickname = localStorage.getItem("nickname") || "";
let theme = localStorage.getItem("theme") || "dark";
document.body.classList.add(theme);

/* --- ТВОЙ КОД БЕЗ ИЗМЕНЕНИЙ --- */

async function login() {
  const provider = new GoogleAuthProvider();
  await signInWithPopup(auth, provider);
}
window.login = login;

function logout() { signOut(auth); }
window.logout = logout;

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (!nickname && user) nickname = user.displayName;
  document.getElementById("userInfo").innerText =
    user ? "Ты: " + nickname : "Не вошёл";
});

function setNickname() {
  const input = document.getElementById("nickname");
  nickname = input.value.trim() || (currentUser ? currentUser.displayName : "Гость");
  document.getElementById("userInfo").innerText =
    currentUser ? "Ты: " + nickname : "Не вошёл";
  input.value = "";
  localStorage.setItem("nickname", nickname);
  renderMessages();
}
window.setNickname = setNickname;

function setNicknameMobile() {
  const input = document.getElementById("mobileNickname");
  nickname = input.value.trim() || (currentUser ? currentUser.displayName : "Гость");
  document.getElementById("userInfo").innerText =
    currentUser ? "Ты: " + nickname : "Не вошёл";
  input.value = "";
  localStorage.setItem("nickname", nickname);
  renderMessages();
}
window.setNicknameMobile = setNicknameMobile;

/* --- ✉️ ОТПРАВКА ТЕКСТА НЕ ТРОГАЛ --- */
function sendMessage() {
  const input = document.getElementById("messageInput");
  if (!input.value || !currentUser) return;

  addDoc(collection(db, "messages"), {
    text: input.value,
    user: nickname || (currentUser ? currentUser.displayName : "Гость"),
    uid: currentUser.uid,
    time: Date.now()
  });

  input.value = "";
  updateButton(); // 👈 добавил только это
}
window.sendMessage = sendMessage;

/* --- ЧАТ --- */
const chat = document.getElementById("chat");
const q = query(collection(db, "messages"), orderBy("time"));
let messagesCache = [];

onSnapshot(q, (snapshot) => {
  messagesCache = snapshot.docs.map(docSnap => ({ id: docSnap.id, data: docSnap.data() }));
  renderMessages();
});

function renderMessages() {
  chat.innerHTML = "";
  messagesCache.forEach(docObj => {
    const data = docObj.data;
    const isMe = currentUser && data.uid === currentUser.uid;
    const displayName = isMe ? nickname || (currentUser ? currentUser.displayName : "Гость") : data.user;

    const div = document.createElement("div");
    div.className = "message " + (isMe ? "me" : "other");

    /* ✅ ВОТ ЕДИНСТВЕННОЕ ИЗМЕНЕНИЕ */
    const content = data.fileType === "audio"
      ? `<audio controls src="${data.fileUrl}"></audio>`
      : data.text || "";

    div.innerHTML = `
      <div class="name">${displayName}</div>
      ${content}
      ${isMe ? `<span class="delete-btn" onclick="deleteMessage('${docObj.id}')">❌</span>` : ""}
    `;

    chat.appendChild(div);
  });
  chat.scrollTop = chat.scrollHeight;
}

async function deleteMessage(id) { await deleteDoc(doc(db, "messages", id)); }
window.deleteMessage = deleteMessage;

/* --- 🎤 ГОЛОСОВЫЕ (ДОБАВЛЕНО) --- */

const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendBtn");

let mediaRecorder;
let audioChunks = [];
let isRecording = false;

function updateButton() {
  if (messageInput.value.trim() === "") {
    sendButton.textContent = isRecording ? "⏹" : "🎤";
    sendButton.onclick = isRecording ? stopRecording : startRecording;
  } else {
    sendButton.textContent = "➤";
    sendButton.onclick = sendMessage;
  }
}

messageInput.addEventListener("input", updateButton);
updateButton();

async function startRecording() {
  if (!currentUser) return alert("Сначала войди");

  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

  mediaRecorder = new MediaRecorder(stream);
  audioChunks = [];

  mediaRecorder.ondataavailable = e => {
    if (e.data.size > 0) audioChunks.push(e.data);
  };

  mediaRecorder.onstop = async () => {
    if (!audioChunks.length) return;

    const blob = new Blob(audioChunks, { type: "audio/webm" });
    const fileRef = ref(storage, "audio/" + Date.now());

    await uploadBytes(fileRef, blob);
    const url = await getDownloadURL(fileRef);

    await addDoc(collection(db, "messages"), {
      user: nickname,
      uid: currentUser.uid,
      fileUrl: url,
      fileType: "audio",
      time: Date.now()
    });
  };

  mediaRecorder.start();
  isRecording = true;
  updateButton();
}

function stopRecording() {
  if (mediaRecorder) mediaRecorder.stop();
  isRecording = false;
  updateButton();
}
</script>
</body>
</html>
