<!DOCTYPE html> 
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПростикРостик</title>

<style>
  body { margin: 0; font-family: Arial; transition: 0.3s; }
  body.dark { background: #0f172a; color: white; }
  body.light { background: #f1f5f9; color: black; }

  header { padding: 15px; font-size: 18px; display: flex; justify-content: space-between; }
  .dark header { background: #1e293b; }
  .light header { background: #e2e8f0; }

  #userPanel {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }

  body.dark #userPanel { background-color: #1e293b; }
  body.light #userPanel { background-color: #e2e8f0; }

  #userPanel button {
    border-radius: 12px;
    padding: 10px 15px;
    border: none;
    cursor: pointer;
    font-weight: bold;
  }

  body.dark #userPanel button { background-color: #2563eb; color: white; }
  body.light #userPanel button { background-color: #3b82f6; color: white; }

  #chat {
    height: 70vh; /* ВАЖНО — возвращаем */
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
  }

  .message {
    max-width: 60%;
    padding: 10px;
    margin: 5px;
    border-radius: 12px;
  }

  .me { align-self: flex-end; background: #3b82f6; color: white; }
  .dark .other { background: #334155; color: white; }
  .light .other { background: #e2e8f0; color: black; }

  .name { font-size: 11px; opacity: 0.7; }

  #inputArea {
    display: flex;
    padding: 10px;
  }

  #messageInput {
    flex: 1;
    padding: 12px;
    border-radius: 20px;
    border: none;
    font-size: 14px;
  }

  button {
    margin-left: 10px;
    padding: 10px;
    border-radius: 12px;
  }

  #themeBtn {
    border-radius: 50%;
    background: transparent;
    width: 36px;
    height: 36px;
  }

  /* 📱 МОБИЛКА */
  @media (max-width: 600px) {

    #chat {
      height: 60vh; /* чуть меньше чтобы всё влезло */
    }

    #userPanel {
      flex-direction: column;
      gap: 6px;
      padding: 8px;
    }

    #userPanel button,
    #userPanel input {
      width: 100%;
      font-size: 16px;
      padding: 12px;
    }

    .message {
      font-size: 16px;
      padding: 12px;
      max-width: 85%;
    }

    #messageInput {
      font-size: 16px;
      padding: 12px;
    }

    #inputArea button {
      font-size: 16px;
      padding: 12px;
    }
  }

</style>
</head>

<body class="dark">

<header>
  ПростикРостик
  <button id="themeBtn" onclick="toggleTheme()">🌗</button>
</header>

<div id="userPanel">
  <input id="nickname" placeholder="Придумай ник..." />
  <button onclick="setNickname()">Сохранить ник</button>
  <button onclick="login()">Войти через Google</button>
  <button onclick="logout()">Выйти</button>
  <div id="userInfo"></div>
</div>

<div id="chat"></div>

<div id="inputArea">
  <input id="messageInput" placeholder="Сообщение..." />
  <button onclick="sendMessage()">➤</button>
</div>

<script type="module">
// ВСТАВЬ СЮДА СВОЙ JS БЕЗ ИЗМЕНЕНИЙ
</script>

</body>
</html>
