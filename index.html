<!DOCTYPE html> 
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПростикРостик</title>
<style>
/* ВСЁ ТВОЁ ОСТАВЛЕНО БЕЗ ИЗМЕНЕНИЙ */
  body { margin: 0; font-family: Arial; transition: 0.3s; display: flex; flex-direction: column; height: 100vh; }
  body.dark { background: #0f172a; color: white; }
  body.light { background: #f8fafc; color: black; }

  header { padding: 15px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; position: relative; }
  body.dark header { background: #1e293b; color: white; }
  body.light header { background: #f1f5f9; color: black; }

  #headerButtons { display: flex; gap: 10px; align-items: center; }
  #themeBtn { border-radius: 50%; background-color: transparent; font-size: 18px; width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; }
  #mobileMenuBtn { display: none; border: none; background: transparent; font-size: 24px; cursor: pointer; }

  #userPanel { position: sticky; top: 0; z-index: 100; padding: 10px; display: flex; flex-wrap: wrap; gap: 10px; border-radius: 0 0 12px 12px; }
  #userPanel button { border-radius: 12px; padding: 10px 15px; border: none; cursor: pointer; }

  #mobileMenu { display: none; position: absolute; top: 60px; right: 10px; }

  #chat { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; }
  .message { max-width: 60%; padding: 10px; margin: 5px; border-radius: 12px; }
  .me { align-self: flex-end; background: #3b82f6; color: white; }
  .other { background: #e5e7eb; }

  #inputArea { display: flex; padding: 10px; }
  input { flex: 1; padding: 10px; border-radius: 10px; }

  button { margin-left: 10px; }
</style>
</head>

<body>

<header>
  ПростикРостик
  <div id="headerButtons">
    <button id="themeBtn" onclick="toggleTheme()">🌗</button>
    <button id="mobileMenuBtn" onclick="toggleMobileMenu()">⋮</button>
  </div>
</header>

<div id="userPanel">
  <input id="nickname" placeholder="Придумай ник..." />
  <button onclick="setNickname()">Сохранить ник</button>
  <button onclick="login()">Войти через Google</button>
  <button onclick="logout()">Выйти</button>
  <div id="userInfo"></div>
</div>

<div id="mobileMenu">
  <input id="mobileNickname" placeholder="Придумай ник..." />
  <button onclick="setNicknameMobile()">Сохранить ник</button>
  <button onclick="login()">Войти через Google</button>
  <button onclick="logout()">Выйти</button>
</div>

<div id="chat"></div>

<div id="inputArea">
  <input id="messageInput" placeholder="Сообщение..." />
  <button id="sendBtn">➤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyDe5k1pVFUxSB33pxwtivIorB0VQ1atc08",
  authDomain: "prostikrostik-90812.firebaseapp.com",
  projectId: "prostikrostik-90812",
  storageBucket: "prostikrostik-90812.appspot.com"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

let currentUser = null;
let nickname = localStorage.getItem("nickname") || "";
let theme = localStorage.getItem("theme") || "dark";
document.body.classList.add(theme);

async function login() {
  const provider = new GoogleAuthProvider();
  await signInWithPopup(auth, provider);
}
window.login = login;

function logout() { signOut(auth); }
window.logout = logout;

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (!nickname && user) nickname = user.displayName;
  document.getElementById("userInfo").innerText =
    user ? "Ты: " + nickname : "Не вошёл";
});

function setNickname() {
  const input = document.getElementById("nickname");
  nickname = input.value.trim() || (currentUser ? currentUser.displayName : "Гость");
  localStorage.setItem("nickname", nickname);
}
window.setNickname = setNickname;

function setNicknameMobile() {
  const input = document.getElementById("mobileNickname");
  nickname = input.value.trim() || (currentUser ? currentUser.displayName : "Гость");
  localStorage.setItem("nickname", nickname);
}
window.setNicknameMobile = setNicknameMobile;

// ===== ОТПРАВКА ТЕКСТА =====
function sendMessage() {
  const input = document.getElementById("messageInput");
  if (!input.value || !currentUser) return;

  addDoc(collection(db, "messages"), {
    text: input.value,
    user: nickname,
    uid: currentUser.uid,
    time: Date.now()
  });

  input.value = "";
  updateButton();
}
window.sendMessage = sendMessage;

// ===== ЧАТ =====
const chat = document.getElementById("chat");
const q = query(collection(db, "messages"), orderBy("time"));

onSnapshot(q, (snapshot) => {
  chat.innerHTML = "";

  snapshot.forEach(docSnap => {
    const data = docSnap.data();
    const isMe = currentUser && data.uid === currentUser.uid;

    const div = document.createElement("div");
    div.className = "message " + (isMe ? "me" : "other");

    let content = data.text || "";
    if (data.fileType === "audio") {
      content = `<audio controls src="${data.fileUrl}"></audio>`;
    }

    div.innerHTML = `
      <div>${data.user}</div>
      ${content}
    `;

    chat.appendChild(div);
  });

  chat.scrollTop = chat.scrollHeight;
});

// ===== ГОЛОСОВЫЕ =====
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendBtn");

let mediaRecorder;
let audioChunks = [];
let isRecording = false;

function updateButton() {
  if (messageInput.value.trim() === "") {
    sendButton.textContent = isRecording ? "⏹" : "🎤";
        sendButton.onclick = isRecording ? stopRecording : startRecording;
  } else {
    sendButton.textContent = "➤";
    sendButton.onclick = sendMessage;
  }
}

messageInput.addEventListener("input", updateButton);
updateButton();

async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

  audioChunks = [];
  mediaRecorder = new MediaRecorder(stream);

  mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

  mediaRecorder.onstop = async () => {
    isRecording = false;
    updateButton();

    const blob = new Blob(audioChunks, { type: "audio/webm" });
    const fileRef = ref(storage, "audio/" + Date.now());

    await uploadBytes(fileRef, blob);
    const url = await getDownloadURL(fileRef);

    await addDoc(collection(db, "messages"), {
      user: nickname,
      uid: currentUser.uid,
      fileUrl: url,
      fileType: "audio",
      time: Date.now()
    });
  };

  mediaRecorder.start();
  isRecording = true;
  updateButton();
}

function stopRecording() {
  mediaRecorder.stop();
}

// ===== UI =====
function toggleTheme() {
  document.body.classList.toggle("dark");
  document.body.classList.toggle("light");
}
window.toggleTheme = toggleTheme;

function toggleMobileMenu() {
  const menu = document.getElementById("mobileMenu");
  menu.style.display = menu.style.display === "flex" ? "none" : "flex";
}
window.toggleMobileMenu = toggleMobileMenu;

</script>
</body>
</html>
