<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ПростикРостик</title>
<style>
  body { margin: 0; font-family: Arial; transition: 0.3s; display: flex; flex-direction: column; height: 100vh; }
  body.dark { background: #0f172a; color: white; }
  body.light { background: #f1f5f9; color: black; }

  header { padding: 15px; font-size: 18px; display: flex; justify-content: space-between; flex-shrink: 0; }
  .dark header { background: #1e293b; }
  .light header { background: #e2e8f0; }

  #userPanel {
    padding: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    flex-shrink: 0;
  }
  body.dark #userPanel { background-color: #1e293b; }
  body.light #userPanel { background-color: #e2e8f0; }

  #userPanel button {
    border-radius: 12px;
    padding: 10px 15px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
  }
  body.dark #userPanel button { background-color: #2563eb; color: white; }
  body.light #userPanel button { background-color: #3b82f6; color: white; }
  #userPanel button:hover { opacity: 0.9; }

  #chat { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; }

  .message {
    max-width: 60%;
    width: fit-content;
    padding: 10px;
    margin: 5px;
    border-radius: 12px;
    position: relative;
    word-wrap: break-word;
  }
  .me { align-self: flex-end; background: #3b82f6; color: white; }
  .dark .other { background: #334155; color: white; }
  .light .other { background: #e2e8f0; color: black; }

  .name { font-size: 11px; opacity: 0.7; }
  .delete-btn { position: absolute; top: 2px; right: 6px; cursor: pointer; font-size: 12px; opacity: 0.6; }

  #inputArea { display: flex; padding: 10px; justify-content: center; background: transparent; flex-shrink: 0; }
  #inputArea input { flex: 1; padding: 12px 16px; border-radius: 25px; border: none; outline: none; background-color: inherit; color: inherit; font-size: 14px; }
  #inputArea button { margin-left: 10px; padding: 10px; border-radius: 12px; cursor: pointer; }

  #themeBtn { border-radius: 50%; background-color: transparent; font-size: 18px; width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; }

  /* Скроллбар */
  body.dark #chat::-webkit-scrollbar { width: 8px; }
  body.dark #chat::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
  body.dark #chat::-webkit-scrollbar-thumb { background-color: #3b82f6; border-radius: 4px; border: 2px solid #1e293b; }
  body.light #chat::-webkit-scrollbar { width: 8px; }
  body.light #chat::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 4px; }
  body.light #chat::-webkit-scrollbar-thumb { background-color: #3b82f6; border-radius: 4px; border: 2px solid #e2e8f0; }

  /* Мобильная версия */
  @media (max-width: 600px) {
    body { height: 100vh; }
    #userPanel { flex-direction: column; }
    #userPanel input, #userPanel button { width: 100%; font-size: 16px; padding: 12px; }
    #inputArea { flex-direction: column; gap: 8px; padding: 10px; }
    #inputArea button { width: 100%; font-size: 16px; padding: 14px; margin-left: 0; }
    #chat { flex: 1; overflow-y: auto; padding: 8px; }
    .message { max-width: 80%; font-size: 15px; padding: 10px 14px; }
  }
</style>
</head>
<body class="dark">

<header>
  ПростикРостик
  <button id="themeBtn" onclick="toggleTheme()">🌗</button>
</header>

<div id="userPanel">
  <input id="nickname" placeholder="Придумай ник..." />
  <button onclick="setNickname()">Сохранить ник</button>
  <button onclick="login()">Войти через Google</button>
  <button onclick="logout()">Выйти</button>
  <div id="userInfo"></div>
</div>

<div id="chat"></div>

<div id="inputArea">
  <input id="messageInput" placeholder="Сообщение..." />
  <button onclick="sendMessage()">➤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDe5k1pVFUxSB33pxwtivIorB0VQ1atc08",
  authDomain: "prostikrostik-90812.firebaseapp.com",
  projectId: "prostikrostik-90812"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
let nickname = localStorage.getItem("nickname") || "";

async function login() { const provider = new GoogleAuthProvider(); await signInWithPopup(auth, provider); }
window.login = login;

function logout() { signOut(auth); }
window.logout = logout;

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (!nickname && user) nickname = user.displayName;
  document.getElementById("userInfo").innerText = user ? "Ты: " + nickname : "Не вошёл";
});

function setNickname() {
  const input = document.getElementById("nickname");
  nickname = input.value.trim() || (currentUser ? currentUser.displayName : "Гость");
  document.getElementById("userInfo").innerText = currentUser ? "Ты: " + nickname : "Не вошёл";
  input.value = "";
  localStorage.setItem("nickname", nickname);
  alert("Твой ник теперь: " + nickname);
}
window.setNickname = setNickname;

function sendMessage() {
  const input = document.getElementById("messageInput");
  if (!input.value || !currentUser) return;
  addDoc(collection(db, "messages"), {
    text: input.value,
    user: nickname || (currentUser ? currentUser.displayName : "Гость"),
    uid: currentUser.uid,
    time: Date.now()
  });
  input.value = "";
}
window.sendMessage = sendMessage;

const chat = document.getElementById("chat");
const q = query(collection(db, "messages"), orderBy("time"));

onSnapshot(q, (snapshot) => {
  chat.innerHTML = "";
  snapshot.forEach(docSnap => {
    const data = docSnap.data();
    const isMe = currentUser && data.uid === currentUser.uid;
    const div = document.createElement("div");
    div.className = "message " + (isMe ? "me" : "other");
    div.innerHTML = `<div class="name">${data.user}</div>${data.text}${isMe ? `<span class="delete-btn" onclick="deleteMessage('${docSnap.id}')">❌</span>` : ""}`;
    chat.appendChild(div);
  });
  chat.scrollTop = chat.scrollHeight;
});

async function deleteMessage(id) { await deleteDoc(doc(db, "messages", id)); }
window.deleteMessage = deleteMessage;

function toggleTheme() { const body = document.body; body.classList.toggle("dark"); body.classList.toggle("light"); }
window.toggleTheme = toggleTheme;
</script>
</body>
</html>
