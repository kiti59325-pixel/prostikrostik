<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПростикРостик</title>

<style>
  body { margin: 0; font-family: Arial; transition: 0.3s; }
  body.dark { background: #0f172a; color: white; }
  body.light { background: #f1f5f9; color: black; }

  /* 🔥 КОНТЕЙНЕР (фикс для ПК) */
  .container {
    max-width: 900px;
    margin: 0 auto;
  }

  header { padding: 15px; font-size: 18px; display: flex; justify-content: space-between; }
  .dark header { background: #1e293b; }
  .light header { background: #e2e8f0; }

  #userPanel {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }

  body.dark #userPanel { background-color: #1e293b; }
  body.light #userPanel { background-color: #e2e8f0; }

  #userPanel button {
    border-radius: 12px;
    padding: 10px 15px;
    border: none;
    cursor: pointer;
    font-weight: bold;
  }

  body.dark #userPanel button { background-color: #2563eb; color: white; }
  body.light #userPanel button { background-color: #3b82f6; color: white; }

  #chat {
    height: 70vh;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
  }

  .message {
    max-width: 60%;
    padding: 10px;
    margin: 5px;
    border-radius: 12px;
    word-wrap: break-word;
    font-size: 14px;
  }

  .me { align-self: flex-end; background: #3b82f6; color: white; }
  .dark .other { background: #334155; }
  .light .other { background: #e2e8f0; color: black; }

  #inputArea {
    display: flex;
    padding: 10px;
    gap: 10px;
  }

  #messageInput {
    flex: 1;
    padding: 12px;
    border-radius: 25px;
    border: none;
    outline: none;
    font-size: 14px;
  }

  body.light #messageInput {
    background: white;
  }

  body.dark #messageInput {
    background: transparent;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
  }

  button { padding: 10px; border-radius: 12px; cursor: pointer; }

  /* 📱 МОБИЛКА */
  @media (max-width: 600px) {

    .container {
      max-width: 100%;
      padding: 0;
    }

    #userPanel {
      flex-direction: column;
    }

    #userPanel input,
    #userPanel button {
      width: 100%;
      font-size: 16px;
      padding: 12px;
    }

    #chat {
      height: 65vh;
    }

    .message {
      max-width: 85%;
      font-size: 16px;
      padding: 12px;
    }

    #messageInput {
      font-size: 16px;
      padding: 14px;
    }

    button {
      font-size: 16px;
    }
  }
</style>
</head>

<body class="dark">

<div class="container">

<header>
  ПростикРостик
  <button onclick="toggleTheme()">🌗</button>
</header>

<div id="userPanel">
  <input id="nickname" placeholder="Придумай ник..." />
  <button onclick="setNickname()">Сохранить ник</button>
  <button onclick="login()">Войти через Google</button>
  <button onclick="logout()">Выйти</button>
  <div id="userInfo"></div>
</div>

<div id="chat"></div>

<div id="inputArea">
  <input id="messageInput" placeholder="Сообщение..." />
  <button onclick="sendMessage()">➤</button>
</div>

</div>

<script type="module">
// твой JS без изменений
</script>

</body>
</html>
