<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПростикРостик</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

body.dark { background: #0f172a; color: white; }
body.light { background: #f1f5f9; color: black; }

/* HEADER */
header {
  padding: 12px 16px;
  font-size: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.dark header { background: #1e293b; }
.light header { background: #e2e8f0; }

/* USER PANEL */
#userPanel {
  padding: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

body.dark #userPanel { background: #1e293b; }
body.light #userPanel { background: #e2e8f0; }

#userPanel button {
  border-radius: 12px;
  padding: 10px;
  border: none;
  cursor: pointer;
}

body.dark #userPanel button { background: #2563eb; color: white; }
body.light #userPanel button { background: #3b82f6; color: white; }

/* CHAT */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
}

/* MESSAGE */
.message {
  max-width: 60%;
  padding: 10px;
  margin: 5px;
  border-radius: 12px;
  font-size: 14px;
}

.me { align-self: flex-end; background: #3b82f6; color: white; }
.dark .other { background: #334155; }
.light .other { background: #e2e8f0; }

.name {
  font-size: 11px;
  opacity: 0.7;
}

/* INPUT */
#inputArea {
  display: flex;
  padding: 10px;
}

#messageInput {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: none;
  font-size: 14px;
}

#inputArea button {
  margin-left: 8px;
  padding: 10px;
  border-radius: 10px;
}

/* МОБИЛЬНАЯ ВЕРСИЯ */
@media (max-width: 600px) {

  header {
    font-size: 18px;
    padding: 8px 12px;
  }

  #userPanel {
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    max-height: 18vh;
    overflow-y: auto;
  }

  #userPanel input,
  #userPanel button {
    font-size: 16px;
    padding: 10px;
  }

  #chat {
    flex: 1;
    padding: 10px;
  }

  .message {
    font-size: 17px;
    padding: 12px 14px;
    max-width: 85%;
    border-radius: 14px;
  }

  .name {
    font-size: 12px;
  }

  #inputArea {
    position: sticky;
    bottom: 0;
    padding: 8px;
    background: inherit;
  }

  #messageInput {
    font-size: 17px;
    padding: 12px 16px;
  }

  #inputArea button {
    font-size: 18px;
    padding: 12px;
  }
}
</style>
</head>

<body class="dark">

<header>
  ПростикРостик
  <button onclick="toggleTheme()">🌗</button>
</header>

<div id="userPanel">
  <input id="nickname" placeholder="Придумай ник...">
  <button onclick="setNickname()">Сохранить ник</button>
  <button onclick="login()">Войти через Google</button>
  <button onclick="logout()">Выйти</button>
  <div id="userInfo"></div>
</div>

<div id="chat"></div>

<div id="inputArea">
  <input id="messageInput" placeholder="Сообщение...">
  <button onclick="sendMessage()">➤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSy...",
  authDomain: "prostikrostik-90812.firebaseapp.com",
  projectId: "prostikrostik-90812"
});

const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
let nickname = localStorage.getItem("nickname") || "";

/* AUTH */
window.login = async () => {
  const provider = new GoogleAuthProvider();
  await signInWithPopup(auth, provider);
};

window.logout = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  document.getElementById("userInfo").innerText =
    user ? "Ты: " + (nickname || user.displayName) : "Не вошёл";
});

/* NICK */
window.setNickname = () => {
  const input = document.getElementById("nickname");
  nickname = input.value.trim();
  localStorage.setItem("nickname", nickname);
  alert("Ник сохранён");
};

/* CHAT */
window.sendMessage = () => {
  const input = document.getElementById("messageInput");
  if (!input.value || !currentUser) return;

  addDoc(collection(db, "messages"), {
    text: input.value,
    user: nickname || currentUser.displayName,
    uid: currentUser.uid,
    time: Date.now()
  });

  input.value = "";
};

const chat = document.getElementById("chat");
const q = query(collection(db, "messages"), orderBy("time"));

onSnapshot(q, (snap) => {
  chat.innerHTML = "";

  snap.forEach(doc => {
    const data = doc.data();
    const div = document.createElement("div");

    div.className = "message " + (data.uid === currentUser?.uid ? "me" : "other");

    div.innerHTML = `
      <div class="name">${data.user}</div>
      ${data.text}
    `;

    chat.appendChild(div);
  });

  chat.scrollTop = chat.scrollHeight;
});

/* THEME */
window.toggleTheme = () => {
  document.body.classList.toggle("dark");
  document.body.classList.toggle("light");
};
</script>

</body>
</html>
