<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПростикРостик Supabase</title>
<style>
  /* Здесь оставляем весь твой CSS без изменений */
</style>
</head>
<body>
<header>
  ПростикРостик
  <div id="headerButtons">
    <button id="themeBtn" onclick="toggleTheme()">🌗</button>
    <button id="mobileMenuBtn" onclick="toggleMobileMenu()">⋮</button>
  </div>
</header>

<div id="userPanel">
  <input id="nickname" placeholder="Придумай ник..." />
  <button onclick="setNickname()">Сохранить ник</button>
  <button onclick="login()">Войти через Google</button>
  <button onclick="logout()">Выйти</button>
  <div id="userInfo"></div>
</div>

<div id="mobileMenu">
  <input id="mobileNickname" placeholder="Придумай ник..." />
  <button onclick="setNicknameMobile()">Сохранить ник</button>
  <button onclick="login()">Войти через Google</button>
  <button onclick="logout()">Выйти</button>
</div>

<div id="chat"></div>

<div id="inputArea">
  <input id="messageInput" placeholder="Сообщение..." />
  <button id="sendRecordBtn">🎤</button>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabaseUrl = 'https://cdasjlliptlfxguwtufq.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkYXNqbGxpcHRsZnhndXd0dWZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MDI4MjgsImV4cCI6MjA5MDk3ODgyOH0.TIrd3D8k_Cw60xhKOnHOjKVPsjLU7G2S2TelTOgMk-c';
const supabase = createClient(supabaseUrl, supabaseKey);

// === Auth Google ===
let currentUser = null;
let nickname = localStorage.getItem("nickname") || "";
let theme = localStorage.getItem("theme") || "dark";
document.body.classList.add(theme);

async function login() {
  const { data, error } = await supabase.auth.signInWithOAuth({ provider: 'google' });
  if(error) alert(error.message);
}
window.login = login;

async function logout() {
  await supabase.auth.signOut();
}
window.logout = logout;

supabase.auth.onAuthStateChange((event, session) => {
  currentUser = session?.user || null;
  if(!nickname && currentUser) nickname = currentUser.user_metadata.full_name || currentUser.email;
  document.getElementById("userInfo").innerText = currentUser ? "Ты: " + nickname : "Не вошёл";
});

// === Ник ===
function setNickname() {
  const input = document.getElementById("nickname");
  nickname = input.value.trim() || (currentUser ? currentUser.user_metadata.full_name : "Гость");
  document.getElementById("userInfo").innerText = currentUser ? "Ты: " + nickname : "Не вошёл";
  input.value = "";
  localStorage.setItem("nickname", nickname);
  renderMessages();
}
window.setNickname = setNickname;

function setNicknameMobile() {
  const input = document.getElementById("mobileNickname");
  nickname = input.value.trim() || (currentUser ? currentUser.user_metadata.full_name : "Гость");
  document.getElementById("userInfo").innerText = currentUser ? "Ты: " + nickname : "Не вошёл";
  input.value = "";
  localStorage.setItem("nickname", nickname);
  renderMessages();
  document.getElementById("mobileMenu").style.display = "none";
}
window.setNicknameMobile = setNicknameMobile;

// === Чат ===
const chat = document.getElementById("chat");
let messagesCache = [];

async function fetchMessages() {
  const { data, error } = await supabase
    .from('messages')
    .select('*')
    .order('created_at', { ascending: true });

  if(error) console.error(error);
  else {
    messagesCache = data;
    renderMessages();
  }
}

// Подписка на новые сообщения
supabase
  .channel('public:messages')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, fetchMessages)
  .subscribe();

function renderMessages() {
  chat.innerHTML = '';
  messagesCache.forEach(msg => {
    const isMe = currentUser && msg.uid === currentUser.id;
    const displayName = isMe ? nickname : msg.user;
    const div = document.createElement("div");
    div.className = "message " + (isMe ? "me" : "other");
    div.innerHTML = `<div class="name">${displayName}</div>`;

    if(msg.is_audio){
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.src = msg.text;
      div.appendChild(audio);
    } else div.insertAdjacentHTML('beforeend', msg.text);

    if(isMe){
      const delBtn = document.createElement("span");
      delBtn.className = "delete-btn";
      delBtn.textContent = "❌";
      delBtn.onclick = () => deleteMessage(msg.id);
      div.appendChild(delBtn);
    }

    chat.appendChild(div);
  });
  chat.scrollTop = chat.scrollHeight;
}

async function deleteMessage(id){
  await supabase.from('messages').delete().eq('id', id);
}
window.deleteMessage = deleteMessage;

// === Тема ===
function toggleTheme(){
  document.body.classList.toggle("dark");
  document.body.classList.toggle("light");
  localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
}
window.toggleTheme = toggleTheme;

// === Мобильное меню ===
function toggleMobileMenu() {
  const menu = document.getElementById("mobileMenu");
  menu.style.display = menu.style.display==="flex"?"none":"flex";
}
window.toggleMobileMenu = toggleMobileMenu;

document.addEventListener('click',function(event){
  const menu=document.getElementById('mobileMenu');
  const btn=document.getElementById('mobileMenuBtn');
  if(menu.style.display==='flex'&&!menu.contains(event.target)&&event.target!==btn){menu.style.display='none';}
});

// === Отправка сообщений ===
const sendRecordBtn = document.getElementById('sendRecordBtn');
const messageInput = document.getElementById('messageInput');

let mediaRecorder, audioChunks=[], isRecording=false;

messageInput.addEventListener('input', ()=> {
  sendRecordBtn.textContent = messageInput.value.trim()!=="" ? "➤" : "🎤";
});

sendRecordBtn.addEventListener('click', async ()=>{
  if(messageInput.value.trim()!==""){
    if(!currentUser) return;
    await supabase.from('messages').insert([{
      text: messageInput.value,
      user: nickname,
      uid: currentUser.id,
      is_audio: false,
      created_at: new Date().toISOString()
    }]);
    messageInput.value = "";
    sendRecordBtn.textContent="🎤";
  } else {
    if(!isRecording){
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, {type:'audio/webm'});
        const reader = new FileReader();
        reader.onloadend = async ()=>{
          const base64Audio = reader.result;
          if(!currentUser) return;
          await supabase.from('messages').insert([{
            text: base64Audio,
            is_audio:true,
            user: nickname,
            uid: currentUser.id,
            created_at: new Date().toISOString()
          }]);
        };
        reader.readAsDataURL(audioBlob);
        stream.getTracks().forEach(track => track.stop());
      };
      mediaRecorder.start();
      isRecording = true;
      sendRecordBtn.textContent="⏹️";
    } else {
      mediaRecorder.stop();
      isRecording = false;
      sendRecordBtn.textContent="🎤";
    }
  }
});

fetchMessages();
</script>
</body>
</html>
