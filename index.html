<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПростикРостик</title>
<style>
  /* --- твои стили без изменений --- */
  body { margin: 0; font-family: Arial; transition: 0.3s; display: flex; flex-direction: column; height: 100vh; }
  body.dark { background: #0f172a; color: white; }
  body.light { background: #f8fafc; color: black; }
  /* ... остальные стили остаются без изменений ... */
</style>
</head>
<body>

<header>
  ПростикРостик
  <div id="headerButtons">
    <button id="themeBtn" onclick="toggleTheme()">🌗</button>
    <button id="mobileMenuBtn" onclick="toggleMobileMenu()">⋮</button>
  </div>
</header>

<div id="userPanel">
  <input id="nickname" placeholder="Придумай ник..." />
  <button onclick="setNickname()">Сохранить ник</button>
  <button onclick="login()">Войти через Google</button>
  <button onclick="logout()">Выйти</button>
  <div id="userInfo"></div>
</div>

<div id="mobileMenu">
  <input id="mobileNickname" placeholder="Придумай ник..." />
  <button onclick="setNicknameMobile()">Сохранить ник</button>
  <button onclick="login()">Войти через Google</button>
  <button onclick="logout()">Выйти</button>
</div>

<div id="chat"></div>

<div id="inputArea">
  <input id="messageInput" placeholder="Сообщение..." />
  <button id="sendRecordBtn">🎤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// === Firebase ===
const firebaseConfig = {
  apiKey: "AIzaSyDe5k1pVFUxSB33pxwtivIorB0VQ1atc08",
  authDomain: "prostikrostik-90812.firebaseapp.com",
  projectId: "prostikrostik-90812"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
let nickname = localStorage.getItem("nickname") || "";
let theme = localStorage.getItem("theme") || "dark";
document.body.classList.add(theme);

// === Авторизация ===
async function login() { const provider = new GoogleAuthProvider(); await signInWithPopup(auth, provider); }
window.login = login;
function logout() { signOut(auth); }
window.logout = logout;

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (!nickname && user) nickname = user.displayName;
  document.getElementById("userInfo").innerText = user ? "Ты: " + nickname : "Не вошёл";
});

// === Ник ===
function setNickname() {
  const input = document.getElementById("nickname");
  nickname = input.value.trim() || (currentUser ? currentUser.displayName : "Гость");
  document.getElementById("userInfo").innerText = currentUser ? "Ты: " + nickname : "Не вошёл";
  input.value = "";
  localStorage.setItem("nickname", nickname);
  renderMessages();
}
window.setNickname = setNickname;

function setNicknameMobile() {
  const input = document.getElementById("mobileNickname");
  nickname = input.value.trim() || (currentUser ? currentUser.displayName : "Гость");
  document.getElementById("userInfo").innerText = currentUser ? "Ты: " + nickname : "Не вошёл";
  input.value = "";
  localStorage.setItem("nickname", nickname);
  renderMessages();
  document.getElementById("mobileMenu").style.display = "none";
}
window.setNicknameMobile = setNicknameMobile;

// === Чат ===
const chat = document.getElementById("chat");
const q = query(collection(db, "messages"), orderBy("time"));
let messagesCache = [];
onSnapshot(q, snapshot => { messagesCache = snapshot.docs.map(d=>({id:d.id,data:d.data()})); renderMessages(); });

function renderMessages() {
  chat.innerHTML = "";
  messagesCache.forEach(docObj => {
    const data = docObj.data;
    const isMe = currentUser && data.uid === currentUser.uid;
    const displayName = isMe ? nickname || (currentUser ? currentUser.displayName : "Гость") : data.user;
    const div = document.createElement("div");
    div.className = "message " + (isMe ? "me" : "other");
    div.innerHTML = `<div class="name">${displayName}</div>`;

    if (data.isAudio) {
      const wrapper = document.createElement("div");
      wrapper.style.display = "flex";
      wrapper.style.flexDirection = "column";
      wrapper.style.gap = "4px";
      wrapper.style.marginTop = "5px";
      wrapper.style.maxWidth = "320px";
      wrapper.style.width = "100%";

      const audio = document.createElement("audio");
      audio.src = data.text;
      audio.preload = "metadata";

      let rate = parseFloat(localStorage.getItem("audioSpeed")) || 1;
      audio.playbackRate = rate;

      const playBtn = document.createElement("div");
      playBtn.style.width = "36px";
      playBtn.style.height = "36px";
      playBtn.style.borderRadius = "50%";
      playBtn.style.display = "flex";
      playBtn.style.alignItems = "center";
      playBtn.style.justifyContent = "center";
      playBtn.style.cursor = "pointer";
      playBtn.style.flexShrink = "0";
      playBtn.textContent = "▶";

      playBtn.onclick = ()=>{
        if(audio.paused){ document.querySelectorAll("audio").forEach(a=>{if(a!==audio)a.pause();}); audio.play(); playBtn.textContent="❚❚"; }
        else { audio.pause(); playBtn.textContent="▶"; }
      };

      audio.addEventListener("timeupdate", ()=>{
        if(!audio.duration)return;
        const percent=(audio.currentTime/audio.duration)*100;
        // можно добавить визуальный прогресс если нужно
      });

      audio.addEventListener("ended", ()=>{
        playBtn.textContent="▶";
        audio.currentTime=0;
      });

      wrapper.appendChild(playBtn);
      div.appendChild(wrapper);
    } else { div.insertAdjacentHTML('beforeend', data.text); }

    if(isMe){ const delBtn=document.createElement("span"); delBtn.className="delete-btn"; delBtn.textContent="❌"; delBtn.onclick=()=>deleteMessage(docObj.id); div.appendChild(delBtn); }
    chat.appendChild(div);
  });
  chat.scrollTop = chat.scrollHeight;
}

async function deleteMessage(id){ await deleteDoc(doc(db,"messages",id)); }
window.deleteMessage = deleteMessage;

// === Тема ===
function toggleTheme() {
  const body=document.body;
  body.classList.toggle("dark");
  body.classList.toggle("light");
  localStorage.setItem("theme", body.classList.contains("dark")?"dark":"light");
  document.getElementById("mobileMenuBtn").style.color = body.classList.contains("dark") ? "white" : "black";
}
window.toggleTheme = toggleTheme;

// === Мобильное меню ===
function toggleMobileMenu() {
  const menu=document.getElementById("mobileMenu");
  menu.style.display = menu.style.display==="flex"?"none":"flex";
}
window.toggleMobileMenu = toggleMobileMenu;

document.addEventListener('click',function(event){
  const menu=document.getElementById('mobileMenu');
  const btn=document.getElementById('mobileMenuBtn');
  if(menu.style.display==='flex'&&!menu.contains(event.target)&&event.target!==btn){menu.style.display='none';}
});

// === Отправка сообщений и аудио с полной остановкой микрофона ===
const sendRecordBtn = document.getElementById('sendRecordBtn');
const messageInput = document.getElementById('messageInput');
let mediaRecorder, audioChunks=[], isRecording=false;

sendRecordBtn.addEventListener('click', async ()=>{
  if(messageInput.value.trim()!==""){
    if(!currentUser)return;
    await addDoc(collection(db,"messages"),{
      text: messageInput.value,
      user: nickname||(currentUser?currentUser.displayName:"Гость"),
      uid: currentUser.uid,
      time: Date.now()
    });
    messageInput.value="";
    sendRecordBtn.textContent="🎤";
  } else {
    if(!isRecording){
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder = new MediaRecorder(stream);
      audioChunks=[];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async ()=>{
        const audioBlob = new Blob(audioChunks,{type:'audio/webm'});
        const reader = new FileReader();
        reader.onloadend = async ()=>{
          const base64Audio = reader.result;
          if(!currentUser)return;
          await addDoc(collection(db,"messages"),{
            text: base64Audio,
            isAudio:true,
            user: nickname||(currentUser?currentUser.displayName:"Гость"),
            uid: currentUser.uid,
            time: Date.now()
          });
        };
        reader.readAsDataURL(audioBlob);

        // 🔹 Полная остановка микрофона после отправки
        stream.getTracks().forEach(track => track.stop());
      };
      mediaRecorder.start();
      isRecording=true;
      sendRecordBtn.textContent="⏹️";
    } else {
      mediaRecorder.stop();
      isRecording=false;
      sendRecordBtn.textContent="🎤";
    }
  }
});
</script>
</body>
</html>
